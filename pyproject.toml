[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-pandas-ta"
version = "0.1.0"
description = "Common pandas-ta indicators accelerated by Mojo"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["numpy>=2.2", "pandas>=2.3"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The 'mode.copy_on_write' option is deprecated",
]
